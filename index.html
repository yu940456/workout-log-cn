<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f5f6f2">
<title>练习日记 · 今日训练</title>
<style>
:root{--ink:#1d2922;--muted:#849087;--line:#e8ece6;--green:#2e6b4d;--green2:#eaf2e9;--orange:#e97b55;--bg:#f5f6f2;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}.shell{max-width:560px;min-height:100vh;margin:auto;padding:20px 20px 44px}.nav{height:44px;display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{display:flex;gap:10px;align-items:center;font-weight:750;font-size:15px}.mark{display:grid;place-items:center;background:var(--green);color:white;width:34px;height:34px;border-radius:12px;font-size:20px}.date{font-size:12px;color:#68746b;background:white;padding:9px 12px;border-radius:22px}.intro{margin-bottom:22px}.kicker{font-size:10px;letter-spacing:1.6px;color:var(--green);font-weight:750;margin-bottom:8px}.intro h1{font-size:29px;line-height:1.26;letter-spacing:-1px;margin:0 0 7px;font-weight:780}.intro p{font-size:13px;color:var(--muted);margin:0}.progress-card{background:var(--green);color:#fff;border-radius:20px;padding:17px 19px;display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;box-shadow:0 10px 25px #315e4319}.progress-label{font-size:11px;opacity:.76}.progress-number{font-size:22px;font-weight:750;letter-spacing:-.6px;margin-top:3px}.progress-number small{font-size:13px;font-weight:500;opacity:.75}.ring{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#d7edc7 var(--pct),#ffffff35 0);position:relative}.ring:before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--green)}.ring span{position:relative;font-size:12px;font-weight:700}.heading{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 12px}.heading strong{font-size:15px}.heading span{font-size:11px;color:var(--muted)}.card{background:var(--white);border:1px solid #edf0eb;border-radius:18px;padding:15px;margin-bottom:11px;box-shadow:0 3px 12px #253d2e08}.card-top{display:flex;align-items:center;gap:10px;margin-bottom:13px}.icon{width:37px;height:37px;border-radius:12px;background:var(--green2);display:grid;place-items:center;font-size:18px}.name{flex:1;font-size:14px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.exercise-meta{font-size:10px;color:var(--muted);margin-top:2px;font-weight:500}.icon-btn{width:30px;height:30px;border:0;background:transparent;color:#a0aaa1;font-size:19px;border-radius:9px;cursor:pointer}.icon-btn:active{background:#f1f3f0}.set-head,.set-row{display:grid;grid-template-columns:36px minmax(65px,1fr) minmax(65px,1fr) 78px;align-items:center;gap:8px}.set-head{padding:0 8px 6px;color:#9aa39b;font-size:10px}.set-row{min-height:43px;padding:5px 7px;border-radius:11px;background:#f7f8f5;margin-bottom:5px}.set-row:last-child{margin-bottom:0}.set-no{font-size:11px;color:#7f8a81;text-align:center;font-weight:650}.set-input{width:100%;min-width:0;border:0;outline:0;background:transparent;font:600 13px inherit;font-size:13px;color:var(--ink);padding:7px 2px}.set-input::placeholder{color:#b4bcb5;font-weight:400}.unit{font-size:10px;color:#9ba49c;margin-left:2px}.set-toggle{height:31px;border:1px solid #e3e9e2;border-radius:9px;background:white;color:#778078;font-size:11px;font-weight:650;cursor:pointer}.set-toggle.done{background:var(--green);border-color:var(--green);color:white}.set-toggle:active{transform:scale(.96)}.card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.tiny-action{border:0;background:none;padding:5px 2px;color:var(--green);font-size:11px;font-weight:650;cursor:pointer}.tiny-action.delete{color:#9aa39b}.empty{background:#fff;border:1px dashed #d5ddd4;border-radius:17px;text-align:center;padding:25px 18px;color:var(--muted);font-size:12px;line-height:1.8}.add-exercise{height:46px;width:100%;border:1px dashed #cbd5ca;border-radius:15px;background:transparent;color:var(--green);font-weight:650;font-size:13px;margin:3px 0 14px;cursor:pointer}.finish{width:100%;border:0;border-radius:15px;height:49px;background:var(--orange);color:#fff;font-size:14px;font-weight:750;box-shadow:0 8px 18px #e97b5528;cursor:pointer}.finish:active{transform:translateY(1px)}.foot{font-size:10px;color:#a0a8a1;text-align:center;margin-top:12px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,18px);opacity:0;pointer-events:none;transition:.22s;background:#1d2922;color:#fff;padding:11px 16px;border-radius:24px;font-size:12px;white-space:nowrap;box-shadow:0 6px 18px #0002}.toast.show{transform:translate(-50%,0);opacity:1}@media(min-width:600px){.shell{padding-top:30px}.intro h1{font-size:32px}}
</style>
<style>
.date-tools{display:flex;align-items:center;gap:3px;background:#fff;padding:4px 5px;border-radius:24px}.date-tools button{border:0;background:transparent;color:#526258;font-size:19px;width:26px;height:28px;border-radius:50%;cursor:pointer}.date-tools button:disabled{opacity:.3}.date-tools input{width:102px;border:0;background:transparent;color:#68746b;font:inherit;font-size:11px;outline:0}.date-tools .today-link{font-size:10px;width:auto;padding:0 5px}.heading{align-items:center}.rest-toggle{border:1px solid #dfe6df;background:#fff;border-radius:20px;padding:8px 11px;color:#536258;font-size:11px;font-weight:650;cursor:pointer}.rest-toggle.active{background:#eaf2e9;color:#2e6b4d;border-color:#d4e3d4}.day-label{font-size:10px;color:#849087;font-weight:500;margin-left:7px}.rest-card{background:#fff;border-radius:18px;padding:28px 20px;text-align:center;margin-bottom:11px}.rest-emoji{font-size:34px;margin-bottom:9px}.rest-title{font-size:16px;font-weight:700}.rest-copy{color:#849087;font-size:12px;line-height:1.7;margin-top:7px}
.plan-note{background:#edf3ec;border-radius:13px;padding:12px 14px;color:#426b4e;font-size:11px;line-height:1.6;margin-bottom:11px}
.transfer{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid #edf0eb;border-radius:14px;padding:11px 13px;margin:-16px 0 22px}.transfer-copy{font-size:10px;color:#849087;line-height:1.45}.transfer-copy strong{display:block;color:#435148;font-size:11px;margin-bottom:2px}.transfer-actions{display:flex;gap:7px;flex-shrink:0}.transfer-actions button{border:1px solid #e3e9e2;background:#fff;color:#2e6b4d;border-radius:9px;padding:8px 9px;font-size:10px;font-weight:650;cursor:pointer}
</style></head>
<body><main class="shell">
<header class="nav"><div class="brand"><span class="mark">↗</span><span>练习日记</span></div><span id="date" hidden></span><div class="date-tools"><button id="prev" aria-label="前一天">‹</button><input id="date-picker" type="date" aria-label="选择训练日期"><button id="next" aria-label="后一天">›</button><button id="today" class="today-link">今天</button></div></header>
<section class="transfer"><div class="transfer-copy"><strong>换设备继续使用</strong>导出记录文件，再在另一台设备导入</div><div class="transfer-actions"><button id="export-data">导出</button><button id="import-data">导入</button><input id="import-file" type="file" accept=".json,application/json" hidden></div></section>
<section class="intro"><div class="kicker">YOUR TRAINING, YOUR PACE</div><h1>今天也动起来。<br>每一组都算数。</h1><p>记下每一组，慢慢看见自己的进步。</p></section>
<section class="progress-card"><div><div class="progress-label" id="progress-label">今日训练进度</div><div class="progress-number"><span id="done">0</span><small> / </small><span id="total">0</span><small> 组完成</small></div></div><div class="ring" id="ring"><span id="percent">0%</span></div></section>
<div class="heading"><strong>训练动作<span class="day-label" id="day-label"></span></strong><span id="exercise-count" hidden></span><button id="rest-toggle" class="rest-toggle">设为休息日</button></div><section id="list"></section>
<button class="add-exercise" id="add">＋ 添加训练动作</button><button class="finish" id="finish">完成训练　→</button><div class="foot">训练数据仅保存在此设备</div>
</main><div id="toast" class="toast"></div>
<script>
const KEY='workout-log-v2';
const starter=[{name:'杠铃深蹲',icon:'🏋️',weight:'40',reps:'10',sets:3},{name:'哑铃卧推',icon:'💪',weight:'12',reps:'10',sets:3},{name:'高位下拉',icon:'🔩',weight:'30',reps:'12',sets:3}];
const todayKey=new Date().toLocaleDateString('sv-SE');
let exercises=[];
function normalize(list){return list.map((e,i)=>{let sets=Array.isArray(e.sets)?e.sets:[];if(!sets.length)sets=Array.from({length:3},()=>false);return {id:e.id||`ex-${Date.now()}-${i}`,name:e.name||'训练动作',icon:e.icon||'🏃',sets:sets.map(s=>typeof s==='object'&&s!==null?{weight:String(s.weight??e.weight??''),reps:String(s.reps??e.reps??'10'),done:!!s.done}:{weight:String(e.weight??''),reps:String(e.reps??'10'),done:!!s})}})}
function load(){try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.date===todayKey&&Array.isArray(saved.exercises))return normalize(saved.exercises);if(saved&&Array.isArray(saved.exercises))return normalize(saved.exercises).map(e=>({...e,sets:e.sets.map(s=>({...s,done:false}))}));let old=JSON.parse(localStorage.getItem('workout-log-v1'));if(Array.isArray(old))return normalize(old)}catch{}return normalize(starter)}
function save(){localStorage.setItem(KEY,JSON.stringify({date:todayKey,exercises}))}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const list=document.querySelector('#list');list.innerHTML=exercises.length?exercises.map((e,i)=>`<article class="card"><div class="card-top"><div class="icon">${e.icon}</div><div class="name">${esc(e.name)}<div class="exercise-meta">${e.sets.filter(s=>s.done).length} / ${e.sets.length} 组完成</div></div><button class="icon-btn" data-remove="${i}" aria-label="删除动作">×</button></div><div class="set-head"><span>组数</span><span>重量 <i class="unit">kg</i></span><span>次数</span><span></span></div>${e.sets.map((s,j)=>`<div class="set-row"><span class="set-no">${String(j+1).padStart(2,'0')}</span><div><input class="set-input" type="number" inputmode="decimal" min="0" step="0.5" placeholder="重量" value="${esc(s.weight)}" data-weight="${i},${j}" aria-label="第${j+1}组重量"><span class="unit">kg</span></div><div><input class="set-input" type="number" inputmode="numeric" min="1" placeholder="次数" value="${esc(s.reps)}" data-reps="${i},${j}" aria-label="第${j+1}组次数"></div><button class="set-toggle ${s.done?'done':''}" data-toggle="${i},${j}">${s.done?'✓ 完成':'完成'}</button></div>`).join('')}<div class="card-bottom"><button class="tiny-action" data-addset="${i}">＋ 加一组</button><button class="tiny-action delete" data-remove="${i}">删除动作</button></div></article>`).join(''):`<div class="empty">今天还没有安排动作。<br>点下面的按钮，添加第一个训练动作。</div>`;
const total=exercises.reduce((n,e)=>n+e.sets.length,0),done=exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0),pct=total?Math.round(done/total*100):0;document.querySelector('#done').textContent=done;document.querySelector('#total').textContent=total;document.querySelector('#percent').textContent=pct+'%';document.querySelector('#ring').style.setProperty('--pct',pct+'%');document.querySelector('#exercise-count').textContent=`${exercises.length} 个动作`}
function showToast(msg){let el=document.querySelector('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.classList.remove('show'),2100)}
document.querySelector('#date').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}).format(new Date());
document.querySelector('#list').addEventListener('click',ev=>{const t=ev.target.closest('[data-toggle]');if(t){const [i,j]=t.dataset.toggle.split(',').map(Number);exercises[i].sets[j].done=!exercises[i].sets[j].done;save();render();return}const a=ev.target.closest('[data-addset]');if(a){const i=+a.dataset.addset,last=exercises[i].sets.at(-1)||{weight:'',reps:'10'};exercises[i].sets.push({weight:last.weight,reps:last.reps,done:false});save();render();return}const r=ev.target.closest('[data-remove]');if(r){const i=+r.dataset.remove;if(confirm(`删除“${exercises[i].name}”及其组数记录？`)){exercises.splice(i,1);save();render()}}});
document.querySelector('#list').addEventListener('input',ev=>{const el=ev.target;const key=el.dataset.weight?'weight':el.dataset.reps?'reps':null;if(!key)return;const [i,j]=el.dataset[key].split(',').map(Number);exercises[i].sets[j][key]=el.value;save()});
document.querySelector('#add').onclick=()=>{const name=prompt('输入动作名称，例如：杠铃硬拉');if(!name||!name.trim())return;exercises.push({id:`ex-${Date.now()}`,name:name.trim(),icon:'🏃',sets:[{weight:'',reps:'10',done:false},{weight:'',reps:'10',done:false},{weight:'',reps:'10',done:false}]});save();render()};
document.querySelector('#finish').onclick=()=>{const total=exercises.reduce((n,e)=>n+e.sets.length,0),done=exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);showToast(total&&done===total?'太棒了，今天的训练完成！':`已完成 ${done} / ${total} 组，继续加油！`)};
exercises=load();save();render();
</script>
<script>
// Daily history and rest-day view.
const HISTORY_KEY='workout-log-v3';
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
const MAX_DATE=dateKey(new Date());let selectedDate=MAX_DATE;
const starterExercises=[{name:'杠铃深蹲',icon:'🏋️',weight:'40',reps:'10',sets:3},{name:'哑铃卧推',icon:'💪',weight:'12',reps:'10',sets:3},{name:'高位下拉',icon:'🔩',weight:'30',reps:'12',sets:3}];
let history={days:{}};
function standardize(list){return list.map((e,i)=>({id:e.id||`ex-${Date.now()}-${i}`,name:e.name||'训练动作',icon:e.icon||'🏃',sets:(Array.isArray(e.sets)&&e.sets.length?e.sets:Array.from({length:3},()=>false)).map(s=>typeof s==='object'&&s!==null?{weight:String(s.weight??e.weight??''),reps:String(s.reps??e.reps??'10'),done:!!s.done}:{weight:String(e.weight??''),reps:String(e.reps??'10'),done:!!s})}))}
function readHistory(){try{const current=JSON.parse(localStorage.getItem(HISTORY_KEY));if(current&&current.days)return current;const old=JSON.parse(localStorage.getItem('workout-log-v2'));if(old&&Array.isArray(old.exercises)){history.days[old.date||MAX_DATE]={exercises:standardize(old.exercises),restDay:false};return history}const legacy=JSON.parse(localStorage.getItem('workout-log-v1'));if(Array.isArray(legacy))history.days[MAX_DATE]={exercises:standardize(legacy),restDay:false}}catch{}return history}
function currentDay(){if(!history.days[selectedDate])history.days[selectedDate]={exercises:selectedDate===MAX_DATE?standardize(starterExercises):[],restDay:false};return history.days[selectedDate]}
function saveHistory(){localStorage.setItem(HISTORY_KEY,JSON.stringify(history))}
function safeText(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function displayDate(key){const [y,m,d]=key.split('-').map(Number);return new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}).format(new Date(y,m-1,d))}
function notify(message){const toast=document.querySelector('#toast');toast.textContent=message;toast.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.classList.remove('show'),2100)}
function draw(){const record=currentDay(),items=record.exercises,list=document.querySelector('#list'),rest=record.restDay,today=selectedDate===MAX_DATE,future=selectedDate>MAX_DATE;document.querySelector('#date-picker').value=selectedDate;document.querySelector('#date-picker').removeAttribute('max');document.querySelector('#next').disabled=false;document.querySelector('#today').hidden=today;document.querySelector('#progress-label').textContent=rest?(future?'已安排休息日':'今天安排了休息'):future?'未来训练计划':today?'今日训练进度':'当日训练进度';document.querySelector('#day-label').textContent=today?'· 今天':`· ${displayDate(selectedDate)}`;const restBtn=document.querySelector('#rest-toggle');restBtn.textContent=rest?'恢复训练日':'设为休息日';restBtn.classList.toggle('active',rest);
if(rest){list.innerHTML='<div class="rest-card"><div class="rest-emoji">🌿</div><div class="rest-title">今天是休息日</div><div class="rest-copy">好好恢复也是训练的一部分。<br>原有训练记录已为你保留。</div></div>';document.querySelector('#add').hidden=true;document.querySelector('#finish').hidden=true;document.querySelector('#done').textContent='—';document.querySelector('#total').textContent='—';document.querySelector('#percent').textContent='休息';document.querySelector('#ring').style.setProperty('--pct','0%');document.querySelector('.heading strong').childNodes[0].textContent='每日安排';return}
document.querySelector('#add').hidden=false;document.querySelector('#finish').hidden=false;document.querySelector('.heading strong').childNodes[0].textContent='训练动作';list.innerHTML=items.length?items.map((exercise,i)=>`<article class="card"><div class="card-top"><div class="icon">${exercise.icon}</div><div class="name">${safeText(exercise.name)}<div class="exercise-meta">${exercise.sets.filter(s=>s.done).length} / ${exercise.sets.length} 组完成</div></div><button class="icon-btn" data-remove="${i}" aria-label="删除动作">×</button></div><div class="set-head"><span>组数</span><span>重量 <i class="unit">kg</i></span><span>次数</span><span></span></div>${exercise.sets.map((set,j)=>`<div class="set-row"><span class="set-no">${String(j+1).padStart(2,'0')}</span><div><input class="set-input" type="number" inputmode="decimal" min="0" step="0.5" placeholder="重量" value="${safeText(set.weight)}" data-weight="${i},${j}" aria-label="第${j+1}组重量"><span class="unit">kg</span></div><div><input class="set-input" type="number" inputmode="numeric" min="1" placeholder="次数" value="${safeText(set.reps)}" data-reps="${i},${j}" aria-label="第${j+1}组次数"></div><button class="set-toggle ${set.done?'done':''}" data-toggle="${i},${j}">${set.done?'✓ 完成':'完成'}</button></div>`).join('')}<div class="card-bottom"><button class="tiny-action" data-addset="${i}">＋ 加一组</button><button class="tiny-action delete" data-remove="${i}">删除动作</button></div></article>`).join(''):'<div class="empty">这一天还没有训练记录。<br>可以添加动作，或将当天设为休息日。</div>';
const total=items.reduce((n,e)=>n+e.sets.length,0),done=items.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0),percent=total?Math.round(done/total*100):0;document.querySelector('#done').textContent=done;document.querySelector('#total').textContent=total;document.querySelector('#percent').textContent=percent+'%';document.querySelector('#ring').style.setProperty('--pct',percent+'%')}
const drawDailyView=draw;
draw=function(){drawDailyView();const future=selectedDate>MAX_DATE,record=currentDay();document.querySelector('#date-picker').removeAttribute('max');document.querySelector('#next').disabled=false;if(!future)return;document.querySelector('#progress-label').textContent=record.restDay?'已安排休息日':'未来训练计划';document.querySelector('.heading strong').childNodes[0].textContent=record.restDay?'每日安排':'训练计划';if(record.restDay){document.querySelector('.rest-title').textContent='已安排休息日';document.querySelector('.rest-copy').innerHTML='给身体留出恢复时间。<br>需要调整时，可以切回训练日。';return}document.querySelector('#list').insertAdjacentHTML('afterbegin','<div class="plan-note">📅 这是未来训练计划。填写动作、重量和次数后会自动保存，到当天即可逐组打卡。</div>');document.querySelectorAll('.set-toggle').forEach(button=>{button.disabled=true;button.textContent='计划'});document.querySelectorAll('.exercise-meta').forEach(meta=>{const card=meta.closest('.card');meta.textContent=`${card.querySelectorAll('.set-row').length} 组已安排`});document.querySelector('.progress-number').innerHTML=`<span>${record.exercises.length}</span><small> 个动作 · </small><span>${record.exercises.reduce((n,e)=>n+e.sets.length,0)}</span><small> 组计划</small>`;document.querySelector('#percent').textContent='计划';document.querySelector('#finish').textContent='保存未来训练计划　→';const empty=document.querySelector('.empty');if(empty)empty.innerHTML='这一天还没有安排训练。<br>添加动作和组数，创建未来训练计划。'};
function chooseDate(key){if(!key){draw();return}selectedDate=key;currentDay();saveHistory();draw()}
document.querySelector('#prev').onclick=()=>{const d=new Date(`${selectedDate}T12:00:00`);d.setDate(d.getDate()-1);chooseDate(dateKey(d))};document.querySelector('#next').onclick=()=>{const d=new Date(`${selectedDate}T12:00:00`);d.setDate(d.getDate()+1);chooseDate(dateKey(d))};document.querySelector('#today').onclick=()=>chooseDate(MAX_DATE);document.querySelector('#date-picker').onchange=e=>chooseDate(e.target.value);
document.querySelector('#rest-toggle').onclick=()=>{const record=currentDay();record.restDay=!record.restDay;saveHistory();draw()};
document.querySelector('#list').addEventListener('click',e=>{e.stopImmediatePropagation();const record=currentDay(),toggle=e.target.closest('[data-toggle]'),addSet=e.target.closest('[data-addset]'),remove=e.target.closest('[data-remove]');if(toggle){const [i,j]=toggle.dataset.toggle.split(',').map(Number);record.exercises[i].sets[j].done=!record.exercises[i].sets[j].done;saveHistory();draw()}else if(addSet){const i=+addSet.dataset.addset,sets=record.exercises[i].sets,last=sets[sets.length-1]||{weight:'',reps:'10'};sets.push({weight:last.weight,reps:last.reps,done:false});saveHistory();draw()}else if(remove){const i=+remove.dataset.remove;if(confirm(`删除“${record.exercises[i].name}”及其组数记录？`)){record.exercises.splice(i,1);saveHistory();draw()}}},true);
document.querySelector('#list').addEventListener('input',e=>{e.stopImmediatePropagation();const field=e.target,key=field.dataset.weight?'weight':field.dataset.reps?'reps':null;if(!key)return;const [i,j]=field.dataset[key].split(',').map(Number);currentDay().exercises[i].sets[j][key]=field.value;saveHistory()},true);
document.querySelector('#add').addEventListener('click',e=>{e.stopImmediatePropagation();const name=prompt('输入动作名称，例如：杠铃硬拉');if(!name||!name.trim())return;currentDay().exercises.push({id:`ex-${Date.now()}`,name:name.trim(),icon:'🏃',sets:[{weight:'',reps:'10',done:false},{weight:'',reps:'10',done:false},{weight:'',reps:'10',done:false}]});saveHistory();draw()},true);
document.querySelector('#finish').addEventListener('click',e=>{e.stopImmediatePropagation();if(selectedDate>MAX_DATE){notify('未来训练计划已保存');return}const items=currentDay().exercises,total=items.reduce((n,x)=>n+x.sets.length,0),done=items.reduce((n,x)=>n+x.sets.filter(s=>s.done).length,0);notify(total&&done===total?'太棒了，这天的训练完成！':`已完成 ${done} / ${total} 组，继续加油！`)},true);
document.querySelector('#export-data').onclick=()=>{saveHistory();const payload={app:'练习日记',version:1,exportedAt:new Date().toISOString(),days:history.days};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`练习日记备份-${MAX_DATE}.json`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('备份文件已导出')};
document.querySelector('#import-data').onclick=()=>document.querySelector('#import-file').click();
document.querySelector('#import-file').onchange=async event=>{const file=event.target.files&&event.target.files[0];if(!file)return;try{const payload=JSON.parse(await file.text());if(!payload||!payload.days||typeof payload.days!=='object'||Array.isArray(payload.days))throw new Error('invalid');if(!confirm('导入文件中的记录？相同日期的本机记录会由导入内容更新。')){event.target.value='';return}let count=0;for(const [key,record] of Object.entries(payload.days)){if(!/^\d{4}-\d{2}-\d{2}$/.test(key)||!record||!Array.isArray(record.exercises))continue;history.days[key]={exercises:standardize(record.exercises),restDay:!!record.restDay};count++}saveHistory();draw();notify(`已导入 ${count} 天的记录`)}catch{alert('无法读取这个备份文件，请选择由练习日记导出的 JSON 文件。')}event.target.value=''};
history=readHistory();currentDay();saveHistory();draw();
</script></body></html>
